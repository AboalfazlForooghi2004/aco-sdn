name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core package
        run: python -m pip install -e .
      - name: Compile Python modules
        run: >-
          python -m compileall -q
          aco controller experiments topology
      - name: Run unit and simulated integration tests
        run: python -m unittest discover -s tests -v
      - name: Run deterministic offline scenarios
        run: >-
          python -m experiments.run
          --output /tmp/offline_comparison.csv