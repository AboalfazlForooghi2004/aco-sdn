name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core package
        run: python -m pip install -e .
      - name: Compile Python modules
        run: >-
          python -m compileall -q
          aco controller experiments learning prediction
          recommendation scripts tests topology
      - name: Run unit and simulated integration tests
        run: python -m unittest discover -s tests -v
      - name: Run deterministic offline scenarios
        run: >-
          python -m experiments.run
          --output /tmp/offline_comparison.csv