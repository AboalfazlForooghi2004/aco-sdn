aco:
  alpha: 1.0
  beta: 2.0
  evaporation: 0.4
  ants: 20
  iterations: 50
  pheromone_initial: 1.0
  deposit_q: 1.0
  seed: 42

cost:
  latency: 0.30
  utilization: 0.30
  loss: 0.25
  hop: 0.15
  latency_reference_ms: 100.0

rerouting:
  utilization_threshold: 0.80
  utilization_hysteresis: 0.10
  loss_threshold: 0.05
  loss_hysteresis: 0.01
  latency_increase_threshold: 0.30
  minimum_improvement: 0.10
  cooldown_seconds: 10

telemetry:
  poll_interval_seconds: 2
  link_capacity_bps: 100000000
  max_age_seconds: 5
  latency_ewma_alpha: 0.30

prediction:
  history_window_seconds: 300
  max_samples_per_link: 180
  horizon_seconds: 60
  min_samples: 5
  min_history_seconds: 20
  latency_growth_ratio: 0.30
  recommendation_minimum_confidence: 0.60
  recommendation_validity_seconds: 90

control:
  mode: recommend
  api_enabled: true
  api_host: 127.0.0.1
  api_port: 8080

events:
  path: data/events.jsonl
  max_events: 1000