---
- name: Provision the ACO-SDN Mininet lab
  hosts: aco_sdn_lab
  become: true
  vars:
    aco_sdn_repo: >-
      https://github.com/AboalfazlForooghi2004/aco-sdn.git
    aco_sdn_dir: /opt/aco-sdn
    aco_sdn_venv: /opt/aco-sdn/.venv

  tasks:
    - name: Install lab operating-system packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - build-essential
          - git
          - iperf3
          - iproute2
          - mininet
          - openvswitch-switch
          - python3
          - python3-dev
          - python3-pip
          - python3-venv
          - tcpdump
        state: present

    - name: Enable Open vSwitch
      ansible.builtin.service:
        name: openvswitch-switch
        state: started
        enabled: true

    - name: Clone or update the project
      ansible.builtin.git:
        repo: "{{ aco_sdn_repo }}"
        dest: "{{ aco_sdn_dir }}"
        version: main
        update: true

    - name: Create virtual environment with system packages
      ansible.builtin.command:
        cmd: >-
          python3 -m venv --system-site-packages
          {{ aco_sdn_venv }}
        creates: "{{ aco_sdn_venv }}/bin/python"

    - name: Install controller Python dependencies
      ansible.builtin.pip:
        requirements: "{{ aco_sdn_dir }}/requirements-lab.txt"
        executable: "{{ aco_sdn_venv }}/bin/pip"

    - name: Verify unit tests
      ansible.builtin.command:
        cmd: >-
          {{ aco_sdn_venv }}/bin/python -m unittest
          discover -s tests -v
        chdir: "{{ aco_sdn_dir }}"
      changed_when: false
